name: Build KGN Android

on:
  workflow_dispatch:
  push:
    paths:
      - kgn-android-source.zip
      - .github/workflows/android-build.yml
      - android-custom/**

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        app: [customer, admin]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract reviewed Android source
        run: |
          mkdir android-app
          unzip -q kgn-android-source.zip -d android-app
          chmod +x android-app/gradlew
      - name: Configure separate customer and admin release 1.2.0
        env:
          KGN_APP: ${{ matrix.app }}
        run: |
          python3 - <<'PYCODE'
          import os, json, re
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('android-app')
          admin = os.environ['KGN_APP'] == 'admin'
          package = 'io.github.waquarahmad622_lgtm.kgnfashionzone'
          target_package = package + '.admin' if admin else package
          app = root / 'app/build.gradle'
          app.write_text(app.read_text().replace('versionCode 1', 'versionCode 3').replace('versionName "1.0.0"', 'versionName "1.2.0"'))
          gradle = root / 'build.gradle'
          gradle.write_text(gradle.read_text().replace('gradle:8.9.1', 'gradle:8.10.1').replace('jcenter()', 'mavenCentral()'))
          icon = root / 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml'
          icon.write_text(icon.read_text().replace('@android:color/white', '@color/kgn_launcher_background'))
          colors = root / 'app/src/main/res/values/colors.xml'
          colors.write_text(colors.read_text().replace('</resources>', '    <color name="kgn_launcher_background">#FFF400</color>\n</resources>'))
          manifest = root / 'twa-manifest.json'
          data = json.loads(manifest.read_text())
          data.update(appVersionName='1.2.0', appVersionCode=3, appVersion='1.2.0')
          manifest.write_text(json.dumps(data, indent=2) + '\n')
          launcher = root / 'app/src/main/java' / Path(package.replace('.', '/')) / 'LauncherActivity.java'
          launcher.write_text(Path('android-custom/LauncherActivity.java').read_text())
          android_manifest = root / 'app/src/main/AndroidManifest.xml'
          xml = android_manifest.read_text()
          # Give each app only its own entry point. Customer privacy links stay on the web.
          entry = '/kgn-fashion-zone/admin.html' if admin else '/kgn-fashion-zone/index.html'
          xml = xml.replace('android:pathPrefix="/kgn-fashion-zone/"', 'android:path="' + entry + '"')
          android_manifest.write_text(xml)
          if admin:
              for path in list((root / 'app/src/main').rglob('*.java')) + [app, android_manifest]:
                  path.write_text(path.read_text().replace(package, target_package))
              app.write_text(app.read_text()
                  .replace("launchUrl: '/kgn-fashion-zone/index.html'", "launchUrl: '/kgn-fashion-zone/admin.html'")
                  .replace("name: 'K.G.N. Fashion Zone'", "name: 'K.G.N. Fashion Zone Admin'")
                  .replace("launcherName: 'KGN Fashion'", "launcherName: 'KGN Admin'"))
              # Native vector makes the owner app visually distinct without changing customer art.
              icon_dir = root / 'app/src/main/res/drawable'
              icon_dir.mkdir(parents=True, exist_ok=True)
              (icon_dir / 'admin_icon.xml').write_text('''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#B70D19" android:pathData="M0,0h108v108h-108z"/><path android:fillColor="#FFF400" android:pathData="M47,24h14l22,60h-15l-4,-13h-21l-4,13h-15zM47,58h13l-6.5,-21z" android:fillType="evenOdd"/></vector>''')
              android_manifest.write_text(android_manifest.read_text().replace('@mipmap/ic_launcher', '@drawable/admin_icon'))
              data.update(packageId=target_package, name='K.G.N. Fashion Zone Admin', launcherName='KGN Admin', startUrl=entry)
              manifest.write_text(json.dumps(data, indent=2) + '\n')
          readme = root / 'README.md'
          readme.write_text('KGN ' + os.environ['KGN_APP'] + ' v1.2.0 (code 3)\n'
              + 'Package: ' + target_package + '\nEntry: ' + entry + '\n'
              + 'Digital Asset Links must include this package and signing certificate.\n'
              + 'Validate startup on a physical Android device before broad distribution.\n')
          Path('dist').mkdir()
          with ZipFile('dist/kgn-' + os.environ['KGN_APP'] + '-source-v1.2.0.zip', 'w', ZIP_DEFLATED) as output:
              for path in root.rglob('*'):
                  if path.is_file(): output.write(path, path.relative_to(root))
          PYCODE
      - name: Build and lint API 36 app
        working-directory: android-app
        run: ./gradlew --no-daemon bundleRelease assembleRelease lintRelease
      - name: Collect unsigned outputs and signing utility
        run: |
          mkdir -p dist
          cp android-app/app/build/outputs/bundle/release/app-release.aab dist/kgn-unsigned.aab
          cp android-app/app/build/outputs/apk/release/app-release-unsigned.apk dist/kgn-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" dist/apksigner.jar
          cp android-app/app/build/reports/lint-results-release.* dist/
          sha256sum dist/* > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kgn-${{ matrix.app }}-unsigned-v1.2.0
          path: dist/
          retention-days: 7
          if-no-files-found: error
